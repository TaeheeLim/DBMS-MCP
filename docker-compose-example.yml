services:
  jdbc-mcp:
    build: .
    image: jdbc-mcp:latest
    container_name: jdbc-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"          # 사내망에서 http://<서버IP>:8000/mcp 로 접근
    environment:
      MCP_TRANSPORT: "http"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      DB_MAX_ROWS: "200"
      # 레지스트리 백엔드 (연결정보를 PostgreSQL 에서 읽음)
      REGISTRY_BACKEND: "postgres"
      REGISTRY_CACHE_TTL: "30"
      # ⚠ 비밀값(REGISTRY_PG_DSN, REGISTRY_ENC_KEY)은 여기 적지 말 것 → registry.env 에서 주입(아래)
    env_file:
      - registry.env          # REGISTRY_PG_DSN, REGISTRY_ENC_KEY (git 제외)
    volumes:
      # 드라이버 jar 는 이미지 밖에서 마운트 (호스트 로컬 파일, 읽기 전용)
      - ./jars:/app/jars:ro
      # file 백엔드로 되돌릴 때만 아래 주석을 풀고 REGISTRY_BACKEND=file 로 바꾼다
      # - ./connections.json:/app/connections.json:ro
    networks:
      - jdbcnet

# ⚠ 이 네트워크를 안전한 대역(172.20.0.0/24)에 고정한다.
#   공유 도커 호스트라 기본 풀의 172.x 가 소진되면 도커가 192.168.0.0/16 을 잡는데,
#   그때 192.168.208.0/20(=192.168.208~223)을 잡으면 사내 LAN 192.168.213.0/24 와 충돌해
#   호스트가 네트워크에서 고립된다(과거 장애 원인). 명시 서브넷으로 그 가능성을 원천 차단.
networks:
  jdbcnet:
    name: jdbc-mcp_net
    ipam:
      config:
        - subnet: 150.0.0.0/24    # 현재 미사용 대역
